[project]
name = "projectapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "nicegui>=3.17.1",
    "pywebview>=6.2.1",
    "httpx>=0.27.0",
]

[project.scripts]
projectapp = "projectapp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/projectapp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "py>=0.0.84",
    "pytest-asyncio>=0.24.0",
]


[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p nicegui.testing.user_plugin"
main_file = ""
